name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            README.md
            CONTRIBUTING.md
            docs/**/*.md

  build-and-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack src/ packages to local feed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/smoke-pack -Force | Out-Null
          dotnet pack src/Catchy.SourceGenerator/Catchy.SourceGenerator.csproj -c Release -o artifacts/smoke-pack -m:1
          dotnet pack src/Catchy/Catchy.csproj                                  -c Release -o artifacts/smoke-pack -m:1
          dotnet pack src/Catchy.Cecil/Catchy.Cecil.csproj                      -c Release -o artifacts/smoke-pack -m:1
          dotnet pack src/Catchy.Playwright/Catchy.Playwright.csproj            -c Release -o artifacts/smoke-pack -m:1
          dotnet pack src/Catchy.Playwright.Visual/Catchy.Playwright.Visual.csproj -c Release -o artifacts/smoke-pack -m:1

      - name: Restore solution
        run: dotnet restore CatchyAssertions.slnx -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/smoke-pack"

      - name: Build solution
        run: dotnet build CatchyAssertions.slnx -c Release --no-restore -m:1

      - name: Targeted tests (core + source generator)
        run: |
          dotnet test tests/CatchyCoreTests/CatchyCoreTests.csproj       -c Release --no-build
          dotnet test tests/CatchySourceGenTests/CatchySourceGenTests.csproj -c Release --no-build

      - name: Docs sanity check (no legacy/status snapshot references)
        shell: pwsh
        run: |
          $patterns = @('roadmap\.md','DOCUMENTATION_SUMMARY\.md','DOCS_READY\.md','archive/')
          $files = Get-ChildItem -Recurse -File -Filter *.md | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git|\.github|\.vs|\.tools\\.store)\\' }
          $hits = $files | Select-String -Pattern $patterns
          if ($hits) {
            $hits | ForEach-Object { Write-Error ("{0}:{1}:{2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
            throw 'Repository docs contain legacy/status-snapshot references.'
          }

      - name: Verify NuGet smoke builds from local feed
        run: dotnet build tests/NuGetPackageSmoke/NuGetPackageSmoke.csproj -c Release --no-restore -m:1
