name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional NuGet version override (e.g. 1.2.3). Leave empty to auto-bump to the next free patch after the latest vX.Y.Z tag.'
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write  # required for Trusted Publishing OIDC
      contents: write  # required to push the auto-bump tag after a successful publish

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(
            'Catchy', 'Catchy.Analyzers', 'Catchy.Cecil', 'Catchy.MSTest',
            'Catchy.NUnit', 'Catchy.Playwright', 'Catchy.Playwright.Visual',
            'Catchy.ReqnrollPlugin', 'Catchy.SourceGenerator', 'Catchy.TUnit', 'Catchy.XUnit'
          )

          # Returns $true if ANY package already has this version on NuGet.org.
          # 404 = package never published = free. Any other error fails the job (no silent swallowing).
          function Test-VersionTaken([string]$ver) {
            foreach ($pkg in $packages) {
              $uri = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLowerInvariant())/index.json"
              try {
                $resp = Invoke-RestMethod -Uri $uri -Method Get
              } catch {
                $code = $_.Exception.Response.StatusCode.value__
                if ($code -eq 404) { continue }
                throw "NuGet lookup failed for $pkg (HTTP $code): $($_.Exception.Message)"
              }
              if ($resp.versions -contains $ver) {
                Write-Host "Version $ver is already published for $pkg."
                return $true
              }
            }
            return $false
          }

          $semver = '^[0-9]+\.[0-9]+\.[0-9]+$'
          $autoBump = $false

          if ($env:EVENT_NAME -eq 'release') {
            $v = $env:RELEASE_TAG.Trim().TrimStart('v', 'V')
            if ($v -notmatch $semver) { throw "Release tag must look like v1.2.3. Received: '$($env:RELEASE_TAG)'" }
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $v = $env:INPUT_VERSION.Trim().TrimStart('v', 'V')
            if ($v -notmatch $semver) { throw "Manual version must look like 1.2.3. Received: '$($env:INPUT_VERSION)'" }
          }
          else {
            $autoBump = $true
            # Base = highest stable version already published on NuGet.org by any of our packages.
            # Git tags are deliberately NOT used: orphan tags from failed runs would skip versions.
            $max = [version]'0.0.0'
            foreach ($pkg in $packages) {
              $uri = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLowerInvariant())/index.json"
              try {
                $resp = Invoke-RestMethod -Uri $uri -Method Get
              } catch {
                $code = $_.Exception.Response.StatusCode.value__
                if ($code -eq 404) { continue }
                throw "NuGet lookup failed for $pkg (HTTP $code): $($_.Exception.Message)"
              }
              foreach ($s in $resp.versions) {
                if ($s -match $semver -and ([version]$s) -gt $max) { $max = [version]$s }
              }
            }
            Write-Host "Highest version published on NuGet.org: $max"

            # Next patch after the highest published one; keep going if (somehow) still occupied.
            $candidate = [version]::new($max.Major, $max.Minor, $max.Build + 1)
            for ($i = 0; ; $i++) {
              if ($i -gt 1000) { throw 'Could not find a free version after 1000 attempts.' }
              $s = $candidate.ToString()
              if (-not (Test-VersionTaken $s)) { $v = $s; break }
              $candidate = [version]::new($candidate.Major, $candidate.Minor, $candidate.Build + 1)
            }
          }

          # Explicit versions (release / manual) are authoritative: fail loudly if occupied, never bump silently.
          if (-not $autoBump -and (Test-VersionTaken $v)) {
            throw "Version $v already exists on NuGet.org. Choose a new version."
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          "auto_bump=$($autoBump.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version: $v (auto-bump: $autoBump)"

      - name: Pack local feed (NuGetPackageSmoke dependencies)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          $vArgs = '-p:MinVerSkip=true', "-p:Version=$ver", "-p:PackageVersion=$ver", "-p:CatchyPackageVersion=$ver"
          New-Item -ItemType Directory -Path artifacts/local-feed -Force | Out-Null
          foreach ($proj in @(
            'src/Catchy.SourceGenerator/Catchy.SourceGenerator.csproj',
            'src/Catchy/Catchy.csproj',
            'src/Catchy.Cecil/Catchy.Cecil.csproj',
            'src/Catchy.Playwright/Catchy.Playwright.csproj',
            'src/Catchy.Playwright.Visual/Catchy.Playwright.Visual.csproj'
          )) {
            dotnet pack $proj -o artifacts/local-feed @vArgs
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $proj" }
          }

      - name: Restore
        run: dotnet restore CatchyAssertions.slnx -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/local-feed" -p:CatchyPackageVersion=${{ steps.version.outputs.version }}

      - name: Build
        run: dotnet build CatchyAssertions.slnx -c Release --no-restore -m:1 -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} -p:CatchyPackageVersion=${{ steps.version.outputs.version }}

      - name: Test (gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/CatchyCoreTests/CatchyCoreTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'CatchyCoreTests failed.' }
          dotnet test tests/CatchySourceGenTests/CatchySourceGenTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'CatchySourceGenTests failed.' }

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          $out = 'artifacts/publish'
          $vArgs = '-p:MinVerSkip=true', "-p:Version=$ver", "-p:PackageVersion=$ver", "-p:CatchyPackageVersion=$ver"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($proj in @(
            'src/Catchy/Catchy.csproj',
            'src/Catchy.SourceGenerator/Catchy.SourceGenerator.csproj',
            'src/Catchy.Analyzers/Catchy.Analyzers.csproj',
            'src/Catchy.Cecil/Catchy.Cecil.csproj',
            'src/Catchy.Playwright/Catchy.Playwright.csproj',
            'src/Catchy.Playwright.Visual/Catchy.Playwright.Visual.csproj',
            'src/Catchy.XUnit/Catchy.XUnit.csproj',
            'src/Catchy.NUnit/Catchy.NUnit.csproj',
            'src/Catchy.MSTest/Catchy.MSTest.csproj',
            'src/Catchy.TUnit/Catchy.TUnit.csproj',
            'src/Catchy.Reqnroll/Catchy.ReqnrollPlugin.csproj'
          )) {
            dotnet pack $proj -c Release --no-build -o $out @vArgs
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $proj" }
          }

      - name: NuGet smoke (local feed validation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/NuGetPackageSmoke/NuGetPackageSmoke.csproj -c Release -m:1 `
            -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/publish" `
            -p:RestoreNoCache=true `
            -p:CatchyPackageVersion=${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw 'NuGet smoke build failed.' }

      - name: NuGet login (Trusted Publishing — OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: OlesMe

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          # No --skip-duplicate: any failure (incl. duplicate version) must turn the job red.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $src = 'https://api.nuget.org/v3/index.json'

          function Get-EntryBaseNames([string]$zipPath, [string[]]$extensions) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $zip.Entries |
                Where-Object { $extensions -contains [System.IO.Path]::GetExtension($_.Name).ToLowerInvariant() } |
                ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Name).ToLowerInvariant() }
            } finally { $zip.Dispose() }
          }

          $pkgs = @(Get-ChildItem 'artifacts/publish/*.nupkg')
          if (-not $pkgs) { throw 'No .nupkg files found in artifacts/publish.' }

          # 1) Main packages first, without implicit symbol upload.
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source $src --no-symbols
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($pkg.Name)." }
          }

          # 2) Symbols. NuGet.org rejects a .snupkg containing a pdb whose dll is not in the .nupkg
          #    (e.g. analyzers / source generators where the dll lives under analyzers/, not lib/).
          #    Such snupkg are skipped with an explicit warning; everything else must succeed.
          foreach ($pkg in $pkgs) {
            $snupkg = [System.IO.Path]::ChangeExtension($pkg.FullName, '.snupkg')
            if (-not (Test-Path $snupkg)) { Write-Host "No symbols package for $($pkg.Name); skipping."; continue }

            $dlls = @(Get-EntryBaseNames $pkg.FullName @('.dll', '.exe'))
            $pdbs = @(Get-EntryBaseNames $snupkg @('.pdb'))
            $orphans = @($pdbs | Where-Object { $dlls -notcontains $_ })
            if ($orphans.Count -gt 0) {
              Write-Host "::warning::Skipping symbols for $($pkg.Name): pdb without dll in nupkg: $($orphans -join ', ')"
              continue
            }

            Write-Host "Pushing symbols $([System.IO.Path]::GetFileName($snupkg))"
            dotnet nuget push $snupkg --api-key $env:NUGET_API_KEY --source $src
            if ($LASTEXITCODE -ne 0) { throw "Symbols push failed for $([System.IO.Path]::GetFileName($snupkg))." }
          }

      # Tag only after everything was published, so a failed run never leaves an orphan tag.
      - name: Tag auto-bumped version
        if: steps.version.outputs.auto_bump == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v${{ steps.version.outputs.version }}'
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The version was free on NuGet before this run, so an existing tag with this name is an
          # orphan from an earlier failed run; move it to the commit that was actually published.
          if (git tag -l $tag) { Write-Host "::warning::Tag $tag already existed (orphan); moving it to HEAD." }
          git tag -f $tag
          git push --force origin $tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tag." }
