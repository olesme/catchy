name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional NuGet version override (e.g. 1.2.3). Leave empty to auto-bump from the latest vX.Y.Z tag.'
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write  # required for Trusted Publishing OIDC
      contents: write  # required to create/update the auto-bump tag when workflow_dispatch is used

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            # Release event: use the exact release tag, without forcing a manual fallback.
            $v = '${{ github.event.release.tag_name }}'.Trim()
            if ([string]::IsNullOrWhiteSpace($v)) {
              throw 'Release tag is empty.'
            }
            $v = $v.TrimStart('v', 'V')
            if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Release tag must be SemVer like v1.2.3. Received: $v"
            }
          } elseif (-not [string]::IsNullOrWhiteSpace('${{ inputs.version }}')) {
            # workflow_dispatch: explicit manual override
            $v = '${{ inputs.version }}'.Trim()
            $v = $v.TrimStart('v', 'V')
            if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Manual version must be a SemVer without a leading 'v' (for example: 1.2.3)"
            }
          } else {
            # workflow_dispatch: auto-bump to the next free NuGet-compatible version.
            # If the latest tag is already occupied on NuGet, keep incrementing until we find an unused version.
            git fetch --tags
            $latestTag = git tag -l "v[0-9]*.[0-9]*.[0-9]*" |
              Sort-Object { [System.Version]($_ -replace '^v','') } |
              Select-Object -Last 1
            if (-not $latestTag) {
              $latestTag = 'v0.0.0'
              Write-Host 'No semver tag found; starting from v0.0.0.'
            }

            $baseVersion = [version]($latestTag -replace '^v','')
            $candidate = [version]::new($baseVersion.Major, $baseVersion.Minor, $baseVersion.Build)
            $packages = @(
              'Catchy',
              'Catchy.Analyzers',
              'Catchy.Cecil',
              'Catchy.MSTest',
              'Catchy.NUnit',
              'Catchy.Playwright',
              'Catchy.Playwright.Visual',
              'Catchy.ReqnrollPlugin',
              'Catchy.SourceGenerator',
              'Catchy.TUnit',
              'Catchy.XUnit'
            )

            $attempts = 0
            do {
              $candidateStr = $candidate.ToString()
              $taken = $false
              foreach ($pkg in $packages) {
                $uri = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLowerInvariant())/index.json"
                try {
                  $existing = Invoke-RestMethod -Uri $uri -Method Get -ErrorAction Stop
                  if ($existing.versions -contains $candidateStr) {
                    $taken = $true
                    break
                  }
                } catch {
                  # Package not published yet; treat this as free.
                }
              }

              if (-not $taken) {
                $v = $candidateStr
                break
              }

              $candidate = [version]::new($candidate.Major, $candidate.Minor, $candidate.Build + 1)
              $attempts += 1
              if ($attempts -gt 1000) {
                throw "Could not find a free publish version after 1000 attempts."
              }
            } while ($true)

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$v"
            git push origin "v$v"
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version: $v"

      - name: Pack local feed (NuGetPackageSmoke dependencies)
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $vArgs = '-p:MinVerSkip=true', "-p:Version=$ver", "-p:PackageVersion=$ver"
          New-Item -ItemType Directory -Path artifacts/local-feed -Force | Out-Null
          @(
            'src/Catchy.SourceGenerator/Catchy.SourceGenerator.csproj',
            'src/Catchy/Catchy.csproj',
            'src/Catchy.Cecil/Catchy.Cecil.csproj',
            'src/Catchy.Playwright/Catchy.Playwright.csproj',
            'src/Catchy.Playwright.Visual/Catchy.Playwright.Visual.csproj'
          ) | ForEach-Object { dotnet pack $_ -o artifacts/local-feed @vArgs }

      - name: Restore
        run: dotnet restore CatchyAssertions.slnx -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/local-feed" -p:CatchyPackageVersion=${{ steps.version.outputs.version }}

      - name: Build
        run: dotnet build CatchyAssertions.slnx -c Release --no-restore -m:1 -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Test (gate)
        run: |
          dotnet test tests/CatchyCoreTests/CatchyCoreTests.csproj       -c Release --no-build
          dotnet test tests/CatchySourceGenTests/CatchySourceGenTests.csproj -c Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $out = 'artifacts/publish'
          $vArgs = '-p:MinVerSkip=true', "-p:Version=$ver", "-p:PackageVersion=$ver"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          @(
            'src/Catchy/Catchy.csproj',
            'src/Catchy.SourceGenerator/Catchy.SourceGenerator.csproj',
            'src/Catchy.Analyzers/Catchy.Analyzers.csproj',
            'src/Catchy.Cecil/Catchy.Cecil.csproj',
            'src/Catchy.Playwright/Catchy.Playwright.csproj',
            'src/Catchy.Playwright.Visual/Catchy.Playwright.Visual.csproj',
            'src/Catchy.XUnit/Catchy.XUnit.csproj',
            'src/Catchy.NUnit/Catchy.NUnit.csproj',
            'src/Catchy.MSTest/Catchy.MSTest.csproj',
            'src/Catchy.TUnit/Catchy.TUnit.csproj',
            'src/Catchy.Reqnroll/Catchy.ReqnrollPlugin.csproj'
          ) | ForEach-Object { dotnet pack $_ -c Release --no-build -o $out @vArgs }

      - name: NuGet smoke (local feed validation)
        shell: pwsh
        run: |
          dotnet build tests/NuGetPackageSmoke/NuGetPackageSmoke.csproj -c Release -m:1 `
            -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/publish" `
            -p:RestoreNoCache=true `
            -p:CatchyPackageVersion=${{ steps.version.outputs.version }}

      - name: NuGet login (Trusted Publishing — OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: OlesMe

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = Get-ChildItem 'artifacts/publish/*.nupkg' | Where-Object { $_.Name -notmatch '\.symbols\.' }
          $syms = Get-ChildItem 'artifacts/publish/*.snupkg'
          foreach ($pkg in ($pkgs + $syms)) {
            $cmd = "dotnet nuget push \"$($pkg.FullName)\" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json"
            Write-Host $cmd
            & dotnet nuget push $pkg.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet push failed for $($pkg.FullName)."
            }
          }

      # Explicit version input is authoritative; no fallback bump when a version is provided.
      # If a package version already exists on NuGet, the push must fail red rather than silently ignoring it.
      - name: Verify version selection
        shell: pwsh
        run: |
          $explicit = '${{ inputs.version }}'
          if (-not [string]::IsNullOrWhiteSpace($explicit)) {
            Write-Host "Manual version is set: $explicit"
            return
          }
          Write-Host "No explicit manual version was supplied; auto-bump behavior is allowed."

      - name: Guard against occupied auto-bump version
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            throw 'Resolved publish version is empty.'
          }
          Write-Host "Resolved version for publish: $v"
          # If the generated version was already published, this step should fail before packaging/pushing.
          # The workflow intentionally rejects duplicate versions instead of silently treating them as success.
          # We do not allow auto-generated versions to remain stale or repeat when NuGet already has the package.
          $published = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/catchy/index.json" -Method Get -ErrorAction SilentlyContinue
          if ($published -and $published.versions -contains $v) {
            throw "Resolved version $v already exists on NuGet.org; choose a new version or provide an explicit version input."
          }

          $packages = @(
            'Catchy',
            'Catchy.Analyzers',
            'Catchy.Cecil',
            'Catchy.MSTest',
            'Catchy.NUnit',
            'Catchy.Playwright',
            'Catchy.Playwright.Visual',
            'Catchy.ReqnrollPlugin',
            'Catchy.SourceGenerator',
            'Catchy.TUnit',
            'Catchy.XUnit'
          )

          foreach ($pkg in $packages) {
            $uri = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLowerInvariant())/index.json"
            $resp = Invoke-RestMethod -Uri $uri -Method Get -ErrorAction SilentlyContinue
            if ($resp -and $resp.versions -contains $v) {
              throw "NuGet version $v is already published for package $pkg; choose a new version before publishing."
            }
          }


